[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supre-robot-play"
version = "0.1.0"
description = "Web diagnostics and control console for Supre robots"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136",
    "uvicorn>=0.46",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[tool.setuptools.packages.find]
include = ["app*"]
